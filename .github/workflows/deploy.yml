name: CI/CD Pipeline - StellarPay Green Belt

on:
  push:
    branches:
      - main

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm install
      - name: Run Tests
        run: npm run test

  contract-build-and-deploy:
    name: Smart Contracts Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32v1-none

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Stellar CLI
        run: cargo binstall -y stellar-cli

      - name: Run Vault Contract Tests
        working-directory: ./contracts/vault
        run: cargo test

      - name: Run Escrow Contract Tests
        working-directory: ./contracts/escrow
        run: cargo test

      - name: Build Vault Contract
        working-directory: ./contracts/vault
        run: stellar contract build

      - name: Build Escrow Contract
        working-directory: ./contracts/escrow
        run: stellar contract build

      - name: Deploy Contracts to Testnet
        run: |
          # Configure network
          stellar network add testnet \
            --rpc-url https://soroban-rpc.testnet.stellar.gateway.fm \
            --network-passphrase "Test SDF Network ; September 2015"
          
          # Generate and fund a temporary testnet identity
          stellar keys generate deployer --network testnet
          PUBKEY=$(stellar keys address deployer)
          curl -s "https://friendbot.stellar.org?addr=$PUBKEY"
          
          # Wait for account to be active on Horizon
          echo "Waiting for account $PUBKEY to be active on testnet..."
          for i in {1..15}; do
            if curl -s "https://horizon-testnet.stellar.org/accounts/$PUBKEY" | grep -q "id"; then
              echo "Account is active on Horizon!"
              break
            fi
            echo "Still waiting ($i)..."
            sleep 2
          done
          sleep 25

          # Deploy Vault Contract
          VAULT_WASM=$(find contracts/vault/target -name "soroban_vault_contract.wasm" | grep release | head -n 1)
          echo "Deploying Vault: $VAULT_WASM"
          stellar contract deploy \
            --wasm $VAULT_WASM \
            --source deployer \
            --network testnet > vault_contract_id.txt
          echo "Vault Contract ID: $(cat vault_contract_id.txt)"

          # Deploy Escrow Contract
          ESCROW_WASM=$(find contracts/escrow/target -name "soroban_escrow_contract.wasm" | grep release | head -n 1)
          echo "Deploying Escrow: $ESCROW_WASM"
          stellar contract deploy \
            --wasm $ESCROW_WASM \
            --source deployer \
            --network testnet > escrow_contract_id.txt
          echo "Escrow Contract ID: $(cat escrow_contract_id.txt)"
          
      - name: Upload Contract IDs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-ids
          path: |
            vault_contract_id.txt
            escrow_contract_id.txt

  deploy-frontend:
    name: Deploy to GitHub Pages
    needs: [frontend-test, contract-build-and-deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm install
      - name: Build App
        run: npm run build
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 10
          reporting_interval: 5000
